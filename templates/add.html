{% extends "layout.html" %}

{% block content %}
<div class="mb-4">
    <h2>{{ 'Edit' if edit else 'Add New' }} Applicant</h2>
    <p class="text-muted">Enter the applicant's financial details. The system will automatically predict their risk profile.</p>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" name="name" value="{{ applicant.name if edit else '' }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Annual Income ($)</label>
                    <input type="number" step="0.01" class="form-control" name="income" min="0" value="{{ applicant.income if edit else '' }}" required>
                </div>
            </div>
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Credit Score</label>
                    <input type="number" class="form-control" name="credit_score" min="300" max="850" value="{{ applicant.credit_score if edit else '' }}" required>
                    <div class="form-text">Must be between 300 and 850.</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Requested Loan Amount ($)</label>
                    <input type="number" step="0.01" class="form-control" name="loan_amount" min="100" value="{{ applicant.loan_amount if edit else '' }}" required>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-md-6">
                    <label class="form-label">Employment History (Years)</label>
                    <input type="number" step="0.1" class="form-control" name="employment_years" min="0" max="60" value="{{ applicant.employment_years if edit else '' }}" required>
                </div>
                <div class="col-md-6 d-flex align-items-center">
                    <div class="form-check mt-4">
                        <input class="form-check-input" type="checkbox" name="prior_default" id="prior_default" {% if edit and applicant.prior_default %}checked{% endif %}>
                        <label class="form-check-label" for="prior_default">
                            Applicant has a prior loan default history
                        </label>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i> Save & Predict Risk</button>
            <a href="{{ url_for('index') }}" class="btn btn-light ms-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
