<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinCore | Loan Risk Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .sidebar {
            height: 100vh;
            background-color: #1a2226;
            color: white;
            padding-top: 20px;
        }
        .sidebar a {
            color: #b8c7ce;
            text-decoration: none;
            padding: 15px 20px;
            display: block;
            transition: 0.3s;
        }
        .sidebar a:hover, .sidebar a.active {
            background-color: #1e282c;
            color: white;
            border-left: 4px solid #3c8dbc;
        }
        .sidebar .navbar-brand {
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            display: block;
            margin-bottom: 30px;
        }
        .main-content {
            padding: 30px;
        }
        .card {
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .card-header {
            background-color: white;
            border-bottom: 1px solid #f4f4f4;
            font-weight: 600;
            padding: 15px 20px;
        }
        .btn-primary {
            background-color: #3c8dbc;
            border-color: #367fa9;
        }
        .btn-primary:hover {
            background-color: #367fa9;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar d-none d-md-block">
                <a class="navbar-brand" href="{{ url_for('index') }}">
                    <i class="bi bi-bank2"></i> FinCore
                </a>
                <a href="{{ url_for('index') }}"><i class="bi bi-people-fill me-2"></i> Applicants Data</a>
                <a href="{{ url_for('add_applicant') }}"><i class="bi bi-person-plus-fill me-2"></i> Add Applicant</a>
                <a href="{{ url_for('predict') }}"><i class="bi bi-graph-up-arrow me-2"></i> Risk Assessment</a>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 main-content">
                <!-- Flashed Messages -->
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
